<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKserver - もっと詳しく</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }
    .more-page {
      width: min(760px, 100%);
      padding: 48px 36px;
      border: 1px solid rgba(115, 130, 120, 0.2);
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(39, 67, 46, 0.065);
    }
    .more-page h1 {
      margin: 0 0 18px;
      font-size: clamp(28px, 4vw, 42px);
    }
    .more-page p {
      margin: 0 0 18px;
      color: #526057;
      line-height: 1.8;
    }
    .more-page a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border: 1px solid rgba(45, 126, 81, 0.46);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="more-page">
    <p class="link"><span class="live-dot"></span>もっと詳しく</p>
    <h1>KKserver について</h1>
    <p>KKserver は、建築・探索・交流を楽しめる Minecraft Paper サーバーです。初めての方でも安心して参加できる環境を整え、みんなで成長できるコミュニティを目指しています。</p>
    <p>サバイバルでの生活も、自由な建築も、定期イベントや交流の時間も、すべて自分のペースで楽しめます。新しい世界に入り、仲間と一緒にワールドを広げていきましょう。</p>
    <a href="./index.html">トップに戻る</a>
  </main>
</body>
</html>
